<div class="login-page-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="brand-badge">
        <span class="material-icons brand-icon">flight_takeoff</span>
      </div>
      <h2>Sri Jagadeeswara</h2>
      <span class="sub-brand">AGRI Drone Management System</span>
      <p>Sign in to manage mission schedules, fleet telemetry, and billing records</p>
    </div>

    <!-- Error Alert -->
    <div class="alert-error" *ngIf="errorMessage">
      <span class="material-icons">error</span>
      <span>{{ errorMessage }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">
          <span class="material-icons icon-sm">person</span>
          <span>Username</span>
        </label>
        <input 
          id="username"
          type="text" 
          formControlName="username" 
          placeholder="admin / pilot" 
          autocomplete="username">
        <small class="error-text" *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid">
          Username is required
        </small>
      </div>

      <div class="form-group">
        <label for="password">
          <span class="material-icons icon-sm">lock</span>
          <span>Password</span>
        </label>
        <div class="password-input-wrap">
          <input 
            id="password"
            [type]="showPassword ? 'text' : 'password'" 
            formControlName="password" 
            placeholder="••••••••" 
            autocomplete="current-password">
          <button 
            type="button" 
            class="btn-toggle-eye" 
            (click)="showPassword = !showPassword"
            tabindex="-1">
            <span class="material-icons icon-sm">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
        <small class="error-text" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          Password must be at least 4 characters
        </small>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || isLoading">
        <span class="material-icons icon-sm" *ngIf="!isLoading">login</span>
        <span class="spinner" *ngIf="isLoading"></span>
        <span>{{ isLoading ? 'Authenticating...' : 'Sign In to Dashboard' }}</span>
      </button>
    </form>

    <div class="login-footer">
      <span>🔒 Authorized Operations Access Only</span>
    </div>
  </div>
</div>
